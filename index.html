<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Daria — Building DayRetro and agent-driven experiments. Projects, writing, and links.">
  <title>Daria</title>
  <style>
    @layer base, card;

    :root {
      --bg-light: #ffffff;
      --bg-dark: #111211;
      --surface-light: #ffffff;
      --surface-dark: #111211;
      --chip-light: #f4f4f4;
      --chip-dark: #222422;
      --ink-light: #1a1a19;
      --ink-dark: #ecece9;
      --muted-light: #686863;
      --muted-dark: #9c9c96;
      --accent-light: #2b664e;
      --accent-dark: #74c4a2;
      --border-light: rgba(26, 26, 25, 0.09);
      --border-dark: rgba(236, 236, 233, 0.11);
      --rule-light: rgba(26, 26, 25, 0.07);
      --rule-dark: rgba(236, 236, 233, 0.08);
      --link-line-light: rgba(26, 26, 25, 0.22);
      --link-line-dark: rgba(236, 236, 233, 0.26);

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --chip: var(--chip-light);
      --ink: var(--ink-light);
      --muted: var(--muted-light);
      --accent: var(--accent-light);
      --border: var(--border-light);
      --rule: var(--rule-light);
      --link-line: var(--link-line-light);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 12px 32px -18px rgba(0, 0, 0, 0.09);

      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;

      color-scheme: light dark;
      accent-color: var(--accent);
      scrollbar-color: var(--muted) transparent;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --chip: var(--chip-dark);
        --ink: var(--ink-dark);
        --muted: var(--muted-dark);
        --accent: var(--accent-dark);
        --border: var(--border-dark);
        --rule: var(--rule-dark);
        --link-line: var(--link-line-dark);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 16px 36px -20px rgba(0, 0, 0, 0.55);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --chip: light-dark(var(--chip-light), var(--chip-dark));
        --ink: light-dark(var(--ink-light), var(--ink-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --rule: light-dark(var(--rule-light), var(--rule-dark));
        --link-line: light-dark(var(--link-line-light), var(--link-line-dark));
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --muted: var(--ink);
        --border: var(--ink);
        --rule: var(--muted);
      }
    }

    @layer base {
      html, body, main, header, section, footer, div, ul, dl, dt, dd, h1, h2, p, a, button, span {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-block-size: 100dvb;
        padding-block: clamp(1rem, 4.5vw, 3rem);
        padding-inline: clamp(0.75rem, 3vw, 1.5rem);
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 0.9375rem;
        line-height: 1.55;
        text-align: start;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      h1, h2 {
        margin: 0;
        text-wrap: balance;
      }

      p {
        margin: 0;
        text-wrap: pretty;
        overflow-wrap: break-word;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        color: inherit;
        text-decoration: underline;
        text-decoration-color: var(--link-line);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        transition: color 140ms ease, text-decoration-color 140ms ease;
      }

      a:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      :where(a, button):focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 3px;
      }
    }

    @layer card {
      .sheet {
        inline-size: min(100%, 39rem);
        margin-inline: auto;
        background: transparent;
        padding-block: clamp(1.5rem, 4vw, 2.5rem);
        padding-inline: clamp(1.25rem, 4.5vw, 2.5rem);
      }

      h1 {
        font-size: clamp(1.625rem, 1.45rem + 0.65vw, 1.9375rem);
        font-weight: 660;
        line-height: 1.18;
        letter-spacing: -0.03em;
      }

      .intro {
        margin-block-start: 0.5rem;
        color: var(--muted);
        max-inline-size: 56ch;
      }

      .intro strong {
        color: var(--ink);
        font-weight: 560;
      }

      .skills {
        display: flex;
        flex-wrap: wrap;
        flex-wrap: balance;
        gap: 0.375rem;
        margin-block-start: 1rem;
      }

      .skills span {
        padding: 0.1875rem 0.5625rem;
        border-radius: 6px;
        background: var(--chip);
        border: 1px solid var(--rule);
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.35;
        color: var(--ink);
        white-space: nowrap;
      }

      section {
        margin-block-start: 1.5rem;
        padding-block-start: 1.25rem;
        border-top: 1px solid var(--rule);
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        margin-block-end: 0.625rem;
      }

      h2 {
        font-size: 0.75rem;
        font-weight: 560;
        letter-spacing: 0.02em;
        color: var(--muted);
      }

      .more-link {
        font-size: 0.8125rem;
        color: var(--muted);
        text-decoration: none;
      }

      .more-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .projects li + li {
        margin-block-start: 0.75rem;
      }

      .projects li > a {
        font-weight: 560;
      }

      .description {
        margin-block-start: 0.1875rem;
        font-size: 0.84375rem;
        line-height: 1.5;
        color: var(--muted);
        max-inline-size: 62ch;
      }

      .links,
      .writing {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.375rem;
      }

      .writing small {
        margin-inline-start: 0.375rem;
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .timeline li + li {
        margin-block-start: 0.75rem;
      }

      .timeline-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.125rem 0.75rem;
        flex-wrap: wrap;
      }

      .timeline-role {
        font-weight: 560;
      }

      .timeline-period {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .posts li + li {
        margin-block-start: 0.4375rem;
      }

      .posts li {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
      }

      .post-date {
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .posts a {
        min-inline-size: 0;
        overflow-wrap: break-word;
      }

      .plain-list li + li,
      .plain-list p + p {
        margin-block-start: 0.4375rem;
      }

      footer {
        margin-block-start: 1.5rem;
        padding-block-start: 1.125rem;
        border-top: 1px solid var(--rule);
      }

      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.875rem 2rem;
        margin: 0;
      }

      .contact dt {
        font-size: 0.71875rem;
        color: var(--muted);
        margin-block-end: 0.1875rem;
      }

      .contact dd {
        margin: 0;
        font-size: 0.8125rem;
        overflow-wrap: anywhere;
      }

      .copy-btn {
        display: inline-flex;
        align-items: baseline;
        gap: 0.4375rem;
        font-family: var(--font-mono);
        font-size: 0.78125rem;
        text-decoration: underline;
        text-decoration-color: transparent;
        text-underline-offset: 3px;
        transition: color 140ms ease, text-decoration-color 140ms ease, scale 120ms ease;
      }

      .copy-btn:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }

      .copy-btn:active {
        scale: 0.98;
      }

      .copy-note {
        font-family: var(--font-sans);
        font-size: 0.6875rem;
        color: var(--accent);
        min-inline-size: 0;
      }

      .status {
        color: var(--muted);
        font-size: 0.875rem;
      }

      @media (max-width: 32rem) {
        .posts li {
          flex-direction: column;
          gap: 0.0625rem;
        }
      }

      @media (forced-colors: active) {
        .sheet,
        .skills span {
          border: 1px solid CanvasText;
        }
      }
    }
  </style>
</head>
<body>
  <main id="app" class="sheet">
    <p class="status">Loading profile…</p>
    <noscript>
      <h1>Daria</h1>
      <p class="intro">Enable JavaScript to render the profile, or read <a href="./README.md">README.md</a> directly.</p>
    </noscript>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');

      function safeHref(raw) {
        try {
          const url = new URL(raw.trim(), window.location.href);
          return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
        } catch {
          return null;
        }
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function createLink(label, href, className) {
        const safe = safeHref(href);
        if (!safe) return document.createTextNode(label);
        const a = el('a', className, label);
        a.href = safe;
        return a;
      }

      function stripBadgesAndComments(md) {
        return md
          .replace(/<!--[\s\S]*?-->/g, '')
          .replace(/<img\b[^>]*>/gi, '')
          .replace(/\r\n?/g, '\n');
      }

      function extractBadgeMeta(imgUrl, alt) {
        const m = /\/badge\/([^/?#]+)/i.exec(imgUrl);
        if (m) {
          const parts = m[1].split('-');
          if (parts.length >= 2) {
            const label = decodeURIComponent(parts[0]).replace(/_/g, ' ');
            const value = decodeURIComponent(parts[1]).replace(/_/g, ' ');
            if (label && value) return `${value} ${label.toLowerCase()}`;
          }
        }
        return alt || '';
      }

      function appendInline(parent, rawText) {
        const cleaned = rawText
          .replace(/\[\s*!\[([^\]]*)\]\(([^)]+)\)\s*\]\(([^)]+)\)/g, '')
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '')
          .trim();

        const tokenRe = /\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g;
        let lastIndex = 0;
        let match;
        while ((match = tokenRe.exec(cleaned)) !== null) {
          if (match.index > lastIndex) {
            parent.appendChild(document.createTextNode(cleaned.slice(lastIndex, match.index)));
          }
          if (match[1] !== undefined) {
            const strong = el('strong');
            appendInline(strong, match[1]);
            parent.appendChild(strong);
          } else if (match[2] !== undefined) {
            parent.appendChild(el('code', undefined, match[2]));
          } else if (match[3] !== undefined && match[4] !== undefined) {
            parent.appendChild(createLink(match[3], match[4]));
          }
          lastIndex = tokenRe.lastIndex;
        }
        if (lastIndex < cleaned.length) {
          parent.appendChild(document.createTextNode(cleaned.slice(lastIndex)));
        }
      }

      function parseReadme(markdown) {
        const text = stripBadgesAndComments(markdown);
        const lines = text.split('\n');
        let title = 'Daria';
        const introLines = [];
        const sections = [];
        let current = null;

        for (const rawLine of lines) {
          const line = rawLine.trimEnd();
          const h1 = /^#\s+(.+)$/.exec(line);
          if (h1 && !current && introLines.length === 0) {
            title = h1[1].trim();
            continue;
          }
          const h2 = /^##\s+(.+)$/.exec(line);
          if (h2) {
            current = { heading: h2[1].trim(), lines: [] };
            sections.push(current);
            continue;
          }
          if (/^---+$/.test(line.trim())) continue;
          if (!current) {
            if (line.trim()) introLines.push(line.trim());
          } else if (line.trim()) {
            current.lines.push(line.trim());
          }
        }
        return { title, intro: introLines.join(' '), sections };
      }

      function splitLeadAndBody(itemText) {
        const dashIdx = itemText.indexOf(' — ');
        if (dashIdx === -1) return { lead: itemText.trim(), body: '' };
        return {
          lead: itemText.slice(0, dashIdx).trim(),
          body: itemText.slice(dashIdx + 3).trim()
        };
      }

      function slugId(name) {
        return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-title';
      }

      function renderSectionWrapper(heading, extraHeadNode) {
        const sec = el('section');
        const id = slugId(heading);
        sec.setAttribute('aria-labelledby', id);
        const head = el('div', 'section-head');
        const h2 = el('h2', undefined, heading);
        h2.id = id;
        head.appendChild(h2);
        if (extraHeadNode) head.appendChild(extraHeadNode);
        sec.appendChild(head);
        return sec;
      }

      function renderSkills(heading, sectionLines) {
        const joined = sectionLines.join(' ');
        const badgeTags = [...joined.matchAll(/!\[([^\]]+)\]\(([^)]+)\)/g)].map(m => m[1].trim());
        const tags = badgeTags.length
          ? badgeTags
          : [...joined.matchAll(/`([^`]+)`/g)].map(m => m[1].trim());
        if (!tags.length) return null;
        const wrap = el('div', 'skills');
        wrap.setAttribute('aria-label', heading);
        for (const tag of tags) {
          wrap.appendChild(el('span', undefined, tag));
        }
        return wrap;
      }

      function renderProjects(heading, sectionLines) {
        let moreNode = null;
        const rows = [];
        for (const line of sectionLines) {
          const item = line.replace(/^[-*]\s+/, '').trim();
          const { lead, body } = splitLeadAndBody(item);
          const linkMatch = /\[([^\]]+)\]\(([^)]+)\)/.exec(lead);
          if (!body && linkMatch && /more on github/i.test(linkMatch[1])) {
            moreNode = createLink(linkMatch[1], linkMatch[2], 'more-link');
            continue;
          }
          rows.push({ item, body, linkMatch });
        }

        const sec = renderSectionWrapper(heading, moreNode);
        const ul = el('ul', 'projects');
        for (const { item, body, linkMatch } of rows) {
          const li = el('li');
          if (linkMatch) {
            li.appendChild(createLink(linkMatch[1], linkMatch[2]));
            if (body) {
              const desc = el('p', 'description');
              appendInline(desc, body);
              li.appendChild(desc);
            }
          } else {
            appendInline(li, item);
          }
          ul.appendChild(li);
        }
        sec.appendChild(ul);
        return sec;
      }

      function renderWebsites(heading, sectionLines) {
        const sec = renderSectionWrapper(heading);
        const ul = el('ul', 'links');
        for (const line of sectionLines) {
          const item = line.replace(/^[-*]\s+/, '').trim();
          const linkMatch = /\[([^\]]+)\]\(([^)]+)\)/.exec(item);
          const { body } = splitLeadAndBody(item);
          if (linkMatch) {
            const li = el('li');
            const label = body && !/https?:/i.test(body) ? body : linkMatch[1];
            li.appendChild(createLink(label, linkMatch[2]));
            ul.appendChild(li);
          }
        }
        sec.appendChild(ul);
        return sec;
      }

      function renderWriting(heading, sectionLines) {
        const sec = renderSectionWrapper(heading);
        const ul = el('ul', 'writing');
        for (const line of sectionLines) {
          const item = line.replace(/^[-*]\s+/, '').trim();
          const badgeMatch = /\[\s*!\[([^\]]*)\]\(([^)]+)\)\s*\]\(([^)]+)\)/.exec(item);
          const badgeText = badgeMatch ? extractBadgeMeta(badgeMatch[2], badgeMatch[1]) : '';
          const linkMatch = /\[([^\]]+)\]\(([^)]+)\)/.exec(item);
          if (linkMatch) {
            const li = el('li');
            const p = el('p');
            p.appendChild(createLink(linkMatch[1], linkMatch[2]));
            if (badgeText) p.appendChild(el('small', undefined, badgeText));
            li.appendChild(p);
            ul.appendChild(li);
          }
        }
        sec.appendChild(ul);
        return sec;
      }

      function renderBackground(heading, sectionLines) {
        const sec = renderSectionWrapper(heading);
        const ul = el('ul', 'timeline');
        for (const line of sectionLines) {
          const item = line.replace(/^[-*]\s+/, '').trim();
          const { lead, body } = splitLeadAndBody(item);
          const plainLead = lead.replace(/\*\*/g, '').trim();
          const periodMatch = /^(.*?)\s*\(([^)]+)\)\s*$/.exec(plainLead);
          const roleText = periodMatch ? periodMatch[1].trim() : plainLead;
          const periodText = periodMatch ? periodMatch[2].trim() : '';

          const li = el('li');
          const head = el('div', 'timeline-head');
          head.appendChild(el('span', 'timeline-role', roleText));
          if (periodText) head.appendChild(el('span', 'timeline-period', periodText));
          li.appendChild(head);

          if (body) {
            const desc = el('p', 'description');
            appendInline(desc, body);
            li.appendChild(desc);
          }
          ul.appendChild(li);
        }
        sec.appendChild(ul);
        return sec;
      }

      function renderRecentPosts(heading, sectionLines) {
        const sec = renderSectionWrapper(heading);
        const ul = el('ul', 'posts');
        for (const line of sectionLines) {
          const item = line.replace(/^[-*]\s+/, '').trim();
          const linkMatch = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(item);
          const li = el('li');
          if (linkMatch) {
            const dated = /^(\d{4}-\d{2}-\d{2})-(.+)$/.exec(linkMatch[1].trim());
            if (dated) {
              li.appendChild(el('span', 'post-date', dated[1]));
              li.appendChild(createLink(dated[2].replace(/-/g, ' '), linkMatch[2]));
            } else {
              li.appendChild(createLink(linkMatch[1], linkMatch[2]));
            }
          } else {
            appendInline(li, item);
          }
          ul.appendChild(li);
        }
        sec.appendChild(ul);
        return sec;
      }

      function normalizeContactCopyValue(rawValue) {
        return rawValue
          .replace(/`/g, '')
          .trim()
          .replace(/\s*\(at symbol\)\s*/gi, '@')
          .replace(/\s*\[at\]\s*/gi, '@')
          .replace(/\s*\[dot\]\s*/gi, '.');
      }

      function renderContactFooter(sectionLines) {
        const footer = el('footer');
        const dl = el('dl', 'contact');
        for (const line of sectionLines) {
          const item = line.replace(/^[-*]\s+/, '').trim();
          const colon = item.indexOf(':');
          if (colon === -1) continue;
          const label = item.slice(0, colon).replace(/\*\*/g, '').trim();
          const value = item.slice(colon + 1).trim();
          const box = el('div');
          box.appendChild(el('dt', undefined, label));
          const dd = el('dd');
          const linkMatch = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(value);
          if (linkMatch) {
            dd.appendChild(createLink(linkMatch[1], linkMatch[2]));
          } else {
            const clean = normalizeContactCopyValue(value);
            const btn = el('button', 'copy-btn');
            btn.type = 'button';
            btn.setAttribute('aria-label', `Copy ${label}: ${clean}`);
            btn.appendChild(document.createTextNode(clean));
            const note = el('span', 'copy-note');
            note.setAttribute('aria-live', 'polite');
            btn.appendChild(note);
            let timer = null;
            btn.addEventListener('click', async () => {
              try {
                await navigator.clipboard.writeText(clean);
                note.textContent = 'Copied';
                clearTimeout(timer);
                timer = setTimeout(() => { note.textContent = ''; }, 1500);
              } catch {}
            });
            dd.appendChild(btn);
          }
          box.appendChild(dd);
          dl.appendChild(box);
        }
        footer.appendChild(dl);
        return footer;
      }

      function renderGeneric(heading, sectionLines) {
        const sec = renderSectionWrapper(heading);
        const container = el('div', 'plain-list');
        let ul = null;
        for (const line of sectionLines) {
          if (/^[-*]\s+/.test(line)) {
            if (!ul) {
              ul = el('ul');
              container.appendChild(ul);
            }
            const li = el('li');
            appendInline(li, line.replace(/^[-*]\s+/, ''));
            ul.appendChild(li);
          } else {
            ul = null;
            const p = el('p');
            appendInline(p, line);
            container.appendChild(p);
          }
        }
        sec.appendChild(container);
        return sec;
      }

      function renderProfile(markdown) {
        const { title, intro, sections } = parseReadme(markdown);
        const frag = document.createDocumentFragment();

        const header = el('header');
        header.appendChild(el('h1', undefined, title));
        if (intro) {
          const introEl = el('p', 'intro');
          appendInline(introEl, intro);
          header.appendChild(introEl);
        }

        let footerEl = null;
        const bodyNodes = [];
        for (const section of sections) {
          const key = section.heading.toLowerCase();
          if (key.includes('things i code with') || key === 'tech stack') {
            const skills = renderSkills(section.heading, section.lines);
            if (skills) header.appendChild(skills);
          } else if (key === 'projects') {
            bodyNodes.push(renderProjects(section.heading, section.lines));
          } else if (key === 'websites') {
            bodyNodes.push(renderWebsites(section.heading, section.lines));
          } else if (key === 'writing') {
            bodyNodes.push(renderWriting(section.heading, section.lines));
          } else if (key === 'background') {
            bodyNodes.push(renderBackground(section.heading, section.lines));
          } else if (key === 'recent posts') {
            bodyNodes.push(renderRecentPosts(section.heading, section.lines));
          } else if (key === 'get in touch') {
            footerEl = renderContactFooter(section.lines);
          } else if (section.lines.length) {
            bodyNodes.push(renderGeneric(section.heading, section.lines));
          }
        }

        frag.appendChild(header);
        for (const node of bodyNodes) frag.appendChild(node);
        if (footerEl) frag.appendChild(footerEl);
        app.replaceChildren(frag);
      }

      async function loadReadme() {
        for (const path of ['./profile.md', './README.md']) {
          try {
            const res = await fetch(path);
            if (res.ok) return await res.text();
          } catch {}
        }
        throw new Error('README_NOT_FOUND');
      }

      loadReadme()
        .then(renderProfile)
        .catch(() => {
          const fallback = el('p', 'status');
          fallback.appendChild(document.createTextNode('Unable to load '));
          fallback.appendChild(createLink('README.md', './README.md'));
          fallback.appendChild(document.createTextNode('.'));
          app.replaceChildren(el('h1', undefined, 'Daria'), fallback);
        });
    })();
  </script>
</body>
</html>
